name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Reliable, full-featured install: pip/pipx-installable wheel + sdist.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  # Standalone CLI binaries for users without Python (core transcription;
  # acoustic diarization needs the pip package with the [diarize] extra).
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: transcript-genie-windows-x64.exe
            built: dist/transcript-genie.exe
          - os: macos-latest
            asset: transcript-genie-macos-arm64
            built: dist/transcript-genie
          - os: ubuntu-latest
            asset: transcript-genie-linux-x64
            built: dist/transcript-genie
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build standalone binary
        run: pyinstaller packaging/transcript-genie.spec --distpath dist --workpath build/pyi --noconfirm
      - name: Smoke test (--help)
        shell: bash
        run: "'${{ matrix.built }}' --help"
      - name: Rename for release
        shell: bash
        run: mv "${{ matrix.built }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: [wheel, binary]
    runs-on: ubuntu-latest
    # Publish on any v* tag (stable), or refresh the rolling "latest" build on
    # every push to main. Runs as long as the (reliable) wheel built, so a
    # freeze failure on one OS never blocks the release.
    if: always() && needs.wheel.result == 'success' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - name: Refresh rolling 'latest' (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build (main)' }}
          files: release/*
          generate_release_notes: true
          body: |
            Transcript Genie — ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'rolling latest build from main (auto-updated on every push)' }}

            **Downloads**
            - `transcript-genie-windows-x64.exe` — **Windows** (no Python needed)
            - `transcript-genie-macos-arm64` — **macOS** (Apple Silicon)
            - `transcript-genie-linux-x64` — Linux
            - `transcript_genie-*.whl` / `*.tar.gz` — `pipx install transcript_genie-*.whl`
              (add the `[diarize]` extra for acoustic speaker diarization)

            Standalone binaries are core transcription and require **ffmpeg** on your PATH.
            > Draft transcripts — not certified. See the README.
