[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-genie"
version = "0.1.0"
description = "Court-quality transcript generator for CourtSmart/FTR discs and generic audio"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.0.0",
    "python-docx>=1.1.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Acoustic speaker diarization (ECAPA). Heavy; opt in when you need it.
diarize = ["torch>=2.0", "torchaudio>=2.0", "speechbrain>=1.0"]
# Additional export formats.
pdf = ["reportlab>=4.0"]

[project.scripts]
transcript-genie = "transcript_genie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
